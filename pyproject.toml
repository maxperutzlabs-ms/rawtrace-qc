[project]
name = "rawtrace-qc"
version = "0.1.0"
description = "Extract TIC and scan-level traces from Thermo and Bruker mass spectrometry raw files and generate interactive HTML QC reports"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "David M. Hollenstein", email = "hollenstein.david@gmail.com" }
]
requires-python = ">=3.12"
keywords = [
    "bruker",
    "mass-spectrometry",
    "proteomics",
    "quality-control",
    "thermo",
    "timstof",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "platformdirs>=4.0",
    "pyarrow>=14.0",
    "plotly>=6.0",
]

[project.optional-dependencies]
cli = [
    "cyclopts>=3.0",
]
gui = [
    "pyside6>=6.8",
]

[project.urls]
Homepage = "https://github.com/maxperutzlabs-ms/rawtrace-qc"
Repository = "https://github.com/maxperutzlabs-ms/rawtrace-qc"
Issues = "https://github.com/maxperutzlabs-ms/rawtrace-qc/issues"

[project.scripts]
rawtrace-qc = "rawtrace_qc.cli:main"
rawtrace-qc-gui = "rawtrace_qc.gui:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "cyclopts>=3.0",
    "pyrefly==1.2.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.1",
]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]
markers = [
    "unit: fast unit tests without external resources or network access",
    "network: tests that require network access",
    "integration: tests covering multi-component workflows and cross-module behavior",
]

[tool.coverage.run]
branch = true
source = ["rawtrace_qc"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true

[tool.ruff]
extend-exclude = ["*.md"]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["rawtrace_qc"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyrefly]
preset = "default"
python-version = "3.12"
project-includes = ["src/**/*.py"]
search-path = ["src"]
