# Lints, type-checks, and runs the test suite on all supported platforms using
# the locked dependencies from `uv.lock`. Linux and Windows run every supported
# Python version, and macOS runs only the latest. Tests marked `network` run
# only in the `test-full` job, so only one job downloads the Thermo helper.

name: CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        python-version: "3.12"

    - name: Install dependencies
      run: uv sync --locked --all-extras

    - name: Ruff lint
      run: uv run ruff check .

    - name: Ruff format
      run: uv run ruff format --check .

    - name: Pyrefly
      run: uv run pyrefly check

  test-no-network:
    name: Test without network tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
        exclude:
        # macOS runners are often unavailable, so test only the latest Python.
        - os: macos-latest
          python-version: "3.12"
        - os: macos-latest
          python-version: "3.13"
        # Covered by the `test-full` job.
        - os: windows-latest
          python-version: "3.12"
    env:
      # Run Qt without a display server so the GUI tests work on headless runners.
      QT_QPA_PLATFORM: offscreen
    steps:
    - uses: actions/checkout@v6

    - name: Install Qt system libraries
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --locked --all-extras

    - name: Run tests
      run: uv run pytest -m "not network" --cov --cov-report=term

  # Runs the whole suite, including the `network` tests, on the oldest supported
  # Python. Add an OS here once rawtrace-qc pins the Thermo helper for it, and
  # exclude the same combination from `test-no-network`.
  test-full:
    name: Full test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python-version: ["3.12"]
    env:
      # Run Qt without a display server so the GUI tests work on headless runners.
      QT_QPA_PLATFORM: offscreen
    steps:
    - uses: actions/checkout@v6

    - name: Install Qt system libraries
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --locked --all-extras

    # The tests accept the Thermo license only in temporary folders. The
    # variable keeps any other helper call away from the runner's profile.
    - name: Run tests
      env:
        THERMO_SCAN_HEADER_EXTRACTOR_CONFIG_DIR: ${{ runner.temp }}/thermo-config
      run: uv run pytest --cov --cov-report=term
